Name: tradeidmgr.rpc
ListenOn: 0.0.0.0:8080
Timeout: 10000

Etcd:
  Hosts:
    - etcd:2379 # 部署到本地docker
    # - 127.0.0.1:2379 # 本地直接运行
    # - etcd-0.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-1.etcd.pay-ns.svc.cluster.local:2379
    # - etcd-2.etcd.pay-ns.svc.cluster.local:2379
  Key: tradeidmgr.rpc

SceneIdList:
  - 0  # UID
  - 1  # C2C

MasterDBConfig:
  # DataSource: root:root123456@tcp(mysql-primary.pay-ns.svc.cluster.local:3306)/user_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s  # k8s
  DataSource: root:root123456@tcp(mysql8:3306)/id_generator_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s  # 开发环境

# Prometheus 指标采集：go-zero 会另起一个独立 HTTP 端口暴露 /metrics
Prometheus:
  Host: 0.0.0.0
  Port: 9090
  Path: /metrics

# 链路追踪：go-zero 通过 OTLP 协议发送 trace 到 Tempo
Telemetry:
  Name: trade_id_mgr
  Endpoint: tempo:4318
  Batcher: otlphttp
  Sampler: 1.0

# AccessLog: 请求/响应日志记录(按字段名脱敏)
AccessLog:
  Enable: true
  SensitiveFields:
    - password
    - user_token
    - old_password
    - new_password
    - pay_password
